<!doctype html>
<html><head><meta charset="utf-8"><title>Blaster bridge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;font:17px/1.35 monospace;padding:14px}
button{font:bold 20px monospace;padding:16px;margin:6px 0;width:100%;background:#fd4;border:0;border-radius:8px;color:#000}
button.alt{background:#68a}
input{font:bold 22px monospace;width:100px;padding:8px;text-transform:uppercase}
.ok{color:#4f4}.bad{color:#f55}.h{color:#fd4}.dim{color:#999}
#log div{border-bottom:1px solid #333;padding:2px 0}
</style></head><body>
<div class="h">BLASTER BRIDGE (sends the blaster trigger to the TV)</div>
<div id="env"></div>
<div>Room: <input id="room" maxlength="8"> <span id="ws">relay: connecting</span></div>
<div id="st" class="dim">Blaster: not connected</div>
<button id="b1">1. CONNECT BLASTER</button>
<button id="b2" class="alt">1b. IF 1 FAILS: SHOW ALL DEVICES</button>
<button id="b3" class="alt">TEST FIRE (sends one shot to the TV, no blaster needed)</button>
<div id="ammo" class="dim"></div>
<div id="log"></div>
<script>
const $=id=>document.getElementById(id);
function add(t,c){const d=document.createElement('div');if(c)d.className=c;d.textContent=new Date().toLocaleTimeString()+'  '+t;$('log').insertBefore(d,$('log').firstChild);while($('log').children.length>30)$('log').removeChild($('log').lastChild)}
window.onerror=(m)=>add('PAGE ERROR: '+m,'bad');
window.addEventListener('unhandledrejection',e=>add('PAGE ERROR: '+(e.reason&&e.reason.message||e.reason),'bad'));
const q=new URLSearchParams(location.search);
let room=(q.get('room')||'ABCD').toUpperCase();$('room').value=room;
$('env').textContent='Web Bluetooth: '+(navigator.bluetooth?'available':'NOT available')+' | secure: '+window.isSecureContext+' | in frame: '+(window.top!==window);
$('env').className=navigator.bluetooth?'ok':'bad';
// ---- relay connection (same room as the tracker; this page acts as an extra "phone") ----
let ws=null,wsT=null;
function connectWS(){
 clearTimeout(wsT);try{if(ws){ws.onclose=null;ws.close()}}catch(e){}
 const proto=location.protocol==='https:'?'wss:':'ws:';
 ws=new WebSocket(proto+'//'+location.host+'/ws?room='+encodeURIComponent(room)+'&role=phone');
 ws.onopen=()=>{$('ws').textContent='relay: connected';$('ws').className='ok'};
 ws.onclose=()=>{$('ws').textContent='relay: reconnecting';$('ws').className='bad';wsT=setTimeout(connectWS,1500)};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.type==='hurt')buzz([60,40,60]);
  else if(m.type==='state'&&typeof m.ammo==='number')$('ammo').textContent='AMMO '+m.ammo+'/'+(m.mag||'?')+(m.lives!==undefined?'  LIVES '+m.lives:'')};
}
function send(o){try{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}catch(e){}}
$('room').onchange=()=>{room=$('room').value.toUpperCase()||'ABCD';connectWS();add('Room set to '+room)};
connectWS();
// ---- feedback ----
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let ac=null;
function shotSound(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const n=ac.sampleRate*.09,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
 const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=.25;s.buffer=b;s.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
// ---- trigger logic ----
let held=false,relT=null,lastReload=0;
function fireDown(){if(!held){held=true;send({type:'fire_down'});buzz(35);shotSound()}clearTimeout(relT);relT=setTimeout(fireUp,180)}
function fireUp(){clearTimeout(relT);if(held){held=false;send({type:'fire_up'})}}
function reload(){const n=Date.now();if(n-lastReload<400)return;lastReload=n;send({type:'reload'});buzz(20)}
function onMsg(t){add('MESSAGE: '+(t===''?'(empty = release)':t),'ok');
 if(t==='ARGun KeyPressed')fireDown();
 else if(t==='')fireUp();
 else if(/^B\d+DOWN$/.test(t))reload()}
$('b3').onclick=()=>{fireDown();add('Test shot sent to room '+room)};
// ---- Bluetooth ----
let dev=null,tries=0;
async function link(d){
 const srv=await d.gatt.connect();add('Connected to GATT','ok');
 const svc=await srv.getPrimaryService(0xFFF0);add('Found service FFF0','ok');
 const ch=await svc.getCharacteristic(0xFFF3);add('Found FFF3','ok');
 ch.addEventListener('characteristicvaluechanged',e=>onMsg(new TextDecoder().decode(e.target.value).trim()));
 await ch.startNotifications();tries=0;
 $('st').textContent='Blaster: CONNECTED. Pull the trigger.';$('st').className='ok';add('Listening. Pull the trigger.','ok');
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen')}catch(e){}
}
async function connect(all){
 try{
  if(!navigator.bluetooth){add('No Web Bluetooth here. Use Chrome, and open this page directly (not inside another page).','bad');return}
  add('Opening device list...');
  const o=all?{acceptAllDevices:true,optionalServices:[0xFFF0]}:{filters:[{namePrefix:'ARGun'},{namePrefix:'ARGUN'},{namePrefix:'ARgun'}],optionalServices:[0xFFF0]};
  dev=await navigator.bluetooth.requestDevice(o);add('Picked: '+(dev.name||'(no name)'),'ok');
  dev.addEventListener('gattserverdisconnected',async()=>{
   fireUp();$('st').textContent='Blaster: DISCONNECTED';$('st').className='bad';add('Blaster disconnected','bad');
   while(tries<5){tries++;await new Promise(r=>setTimeout(r,2000));add('Reconnect try '+tries);try{await link(dev);return}catch(e){add('Retry failed: '+e.name,'bad')}}
   add('Gave up. Tap CONNECT BLASTER again.','bad')});
  await link(dev);
 }catch(e){add('ERROR: '+e.name+' - '+e.message,'bad')}
}
$('b1').onclick=()=>connect(false);
$('b2').onclick=()=>connect(true);
add('Page ready. Step 1: tap CONNECT BLASTER.');
</script></body></html>
