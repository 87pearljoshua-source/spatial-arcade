<script>
// BAT ALLEY - first-person street brawler. The phone camera follows your bat; swings sweep left/right and knock enemies back. The phone camera follows your hand (posesend.html) or a bright orange bat (batsend.html); a real swing hits. Before the first pitch you swing 3 times to calibrate.
const qp=new URLSearchParams(location.search),DEBUG=qp.has('debug'),room=(qp.get('room')||'ABCD').toUpperCase();
let FORCE=+qp.get('force')||1.2;const OKSWING=qp.has('okswing'),NOCAL=qp.has('nocal')||qp.has('force')||DEBUG; // arm speed (camera-widths/s) that counts as a swing; ?okswing lets OK swing too
const GX=+qp.get('gx')||1.8,GY=+qp.get('gy')||1.8; // hand gain (tune if your reach feels too small/large)
const W=256,H=144,HZ=52,VPX=128,NP=5;
const c=document.getElementById('c'),cg=c.getContext('2d');
const bufc=document.createElement('canvas');bufc.width=256;bufc.height=144;
const g=bufc.getContext('2d',{willReadFrequently:true});g.imageSmoothingEnabled=false; // scene is drawn here, then bent + posterized onto the screen canvas
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// ---- fisheye + PS1-style color (precomputed once) ----
const FK=.5,MAP=new Int32Array(W*H),VG=new Uint16Array(W*H),BAY=[-4,0,-3,1,2,-2,3,-1,-3,1,-4,0,4,-1,2,-2];
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=(x+.5)/W*2-1,py=(y+.5)/H*2-1,r2=px*px+py*py,f=(1+FK*r2)/(1+FK);
 const sx=Math.floor((px*f+1)/2*W),sy=Math.floor((py*f+1)/2*H),i=y*W+x;
 MAP[i]=(sx<0||sx>=W||sy<0||sy>=H)?-1:sy*W+sx;VG[i]=Math.max(40,Math.round(256*(1-.42*(r2/2)*(r2/2)*2)))}
function present(){const id=g.getImageData(0,0,W,H),src=new Uint32Array(id.data.buffer),od=cg.createImageData(W,H),out=new Uint32Array(od.data.buffer);
 for(let i=0;i<W*H;i++){const s=MAP[i];if(s<0){out[i]=0xFF000000;continue}
  const p=src[s],v=VG[i],d=BAY[(i&3)|(((i>>8)&3)<<2)];
  let r=((p&255)*v>>8)+d,gg=(((p>>8)&255)*v>>8)+d,b=(((p>>16)&255)*v>>8)+d;
  r=r<0?0:r>255?255:r;gg=gg<0?0:gg>255?255:gg;b=b<0?0:b>255?255:b;r&=0xF8;gg&=0xF8;b&=0xF8;r|=r>>5;gg|=gg>>5;b|=b>>5;
  out[i]=0xFF000000|(b<<16)|(gg<<8)|r}
 cg.putImageData(od,0,0)}
// screen pixel -> scene pixel (so a mouse lines up with what you see)
const toScene=(dx,dy)=>{const x=clamp(Math.floor(dx),0,W-1),y=clamp(Math.floor(dy),0,H-1),s=MAP[y*W+x];return s<0?{x:dx,y:dy}:{x:s%W,y:(s/W)|0}};
// scene pixel -> screen pixel (test hook only)
const toScreen=(sx,sy)=>{let best=null,bd=1e9;for(let i=0;i<W*H;i++){const s=MAP[i];if(s<0)continue;const d=Math.abs(s%W-sx)+Math.abs(((s/W)|0)-sy);if(d<bd){bd=d;best=i;if(d===0)break}}return{x:best%W+.5,y:((best/W)|0)+.5}};
let samples=[],spd=0,cool=0;let hand={x:.5,y:.6,t:0},sm={x:.5,y:.6},dbg=null;
// ---- network ----
let ws=null;
function conn(){try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+room+'&role=tv');
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
  if(m.type==='peer_joined')phoneUp=true;else if(m.type==='peer_left')phoneUp=false;
  else if(m.type==='pose'){phoneUp=true;if(m.v>.4){const n=performance.now();hand.x=m.x;hand.y=m.y;hand.t=n;samples.push({t:n,x:m.x,y:m.y});while(samples.length&&n-samples[0].t>600)samples.shift()}}
  else if(m.type==='shape')onShape(m);else if(m.type==='fire_down')press()};
 ws.onclose=()=>{phoneUp=false;setTimeout(conn,1500)};ws.onerror=()=>{try{ws.close()}catch(e){}}}catch(e){setTimeout(conn,3000)}}
conn();
// ---- game ----
const handPx=()=>dbg&&performance.now()-hand.t>1500?dbg:{x:W*clamp(.5+(sm.x-.5)*GX,.02,.98),y:H*clamp(.5+(sm.y-.6)*GY,.08,.95)};
const camLive=()=>performance.now()-hand.t<1500;
function armSpeed(now){if(samples.length<2)return 0;const b=samples[samples.length-1];if(now-b.t>130)return 0;
 let a=null;for(const s of samples){if(now-s.t<=170&&b.t-s.t>=70){a=s;break}}if(!a)return 0;
 return Math.hypot(b.x-a.x,b.y-a.y)/((b.t-a.t)/1000)}
function startOrCal(){if(camLive()&&!cal.done){scene='cal';cal.n=0;cal.cp=0;cal.peaks=[];cal.t=0;cal.last=0;cal.hold=0}else startGame()}
function calFinish(){const q=cal.peaks.slice().sort((x,y)=>x-y),a=q[q.length>>1];FORCE=clamp(.6*a,.8,6);cal.done=true;cal.t=-1.4}

// ---- brawler ----
let cal={n:0,cp:0,peaks:[],t:0,done:NOCAL,last:0,hold:0},scene='title',hp=100,score=0,wave=0,kills=0,combo=0,bestCombo=0,comboT=0,E=[],queue=[],spawnT=0,banner='',bannerT=0,swing=0,sw=null,swCd=0,flash=0,hurtF=0,shake=0,pops=[],endT=0,won=false,phoneUp=false,clock=0,waveGap=0;
/*RANK*/
// Turn the phone's shape numbers into a ranked list of guesses. These are hand-tuned rules, not a trained model.
const tz=(x,a,b,c,d)=>x<=a||x>=d?0:x<b?(x-a)/(b-a):x<=c?1:(d-x)/(d-c);
function rankWeapons(f){
 const p=f.prof,avg=(a,b)=>{let s=0;for(let i=a;i<=b;i++)s+=p[i];return s/(b-a+1)};
 const med=[...p.slice(0,5)].sort((a,b)=>a-b)[2],taper=avg(5,7)/Math.max(.2,avg(0,2)),head=Math.max(p[6],p[7])/Math.max(.2,med),ar=f.ar,dev=f.dev;
 const multi=f.blobs>=2;
 const curv=Math.max(dev/.04,(f.tort-1.05)/.25),strt=curv<.75?1:.4,nohead=head<1.3?1:.3,bent=f.tort>1.3?.3:1;
 let s={
  bat:tz(ar,2.5,5,11,18)*tz(taper,1.25,1.8,4,8)*bent,
  plank:tz(ar,3.5,6,24,50)*tz(taper,.6,.8,1.3,1.6)*tz(f.fill,.55,.8,1.1,1.3)*strt*nohead*bent,
  club:tz(ar,7,12,45,90)*tz(head,1.25,1.5,6,10)*bent,
  whip:tz(Math.max(ar,f.arc),14,22,400,900)*(.35+.65*Math.min(Math.max(curv,0),1))*(head<1.35?1:.4),
  nunchucks:multi?.9:(tz(ar,3,5,13,20)*Math.min(dev/.1,1)*.7)};
 if(multi){for(const k of['bat','plank','club','whip'])s[k]*=.25}
 const sum=Object.values(s).reduce((a,b)=>a+b,0)+1e-6;
 const out=Object.keys(s).map(k=>({w:k,p:Math.max(.02,s[k]/Math.max(sum,.4)),raw:s[k]})).sort((a,b)=>b.raw-a.raw||b.p-a.p);
 return out}
/*ENDRANK*/

// ---- weapons ----
const WP={fists:{n:'FISTS',cd:.2,d:-1,half:-2,zmin:.62,hint:'FAST  -  SHORT REACH'},bat:{n:'BASEBALL BAT',cd:.3,d:0,half:0,zmin:.5,hint:'BALANCED'},plank:{n:'2X4 LUMBER',cd:.46,d:1,half:2,zmin:.5,hint:'SLOW  -  HEAVY HITS'},club:{n:'GOLF CLUB',cd:.38,d:0,half:12,zmin:.5,hint:'WIDE SWEEP'},whip:{n:'WHIP',cd:.32,d:0,half:8,zmin:.28,hint:'LONG REACH'},nunchucks:{n:'NUNCHUCKS',cd:.16,d:-1,half:4,zmin:.5,hint:'VERY FAST COMBOS'}};
const ALLW=['fists','bat','plank','club','whip','nunchucks'];
let weapon='fists',menuSel=0,menu=[],scanT=0,scanMsg='',scanSent=0,gridAll=false,punch=0;
function goWeapon(){scene='weapon';menu=[{id:'fists'},{id:'scan'}];menuSel=0;gridAll=false}
function startScan(){scene='scan';scanT=0;scanMsg='';scanSent=0}
function onShape(m){if(scene!=='scan')return;if(m.none){scanMsg='NOTHING SEEN. TAP THE OBJECT ON THE PHONE SCREEN, THEN TRY AGAIN.';scanT=Math.max(scanT,8);return}
 let r;try{r=rankWeapons(m)}catch(e){scanMsg='SCAN FAILED';return}
 menu=r.slice(0,3).map(x=>({id:x.w}));menu.push({id:'other'});menuSel=0;gridAll=false;scene='pick'}
function chooseWeapon(id){weapon=id;startOrCal()}
function menuOK(){
 if(scene==='weapon'){if(menu[menuSel].id==='fists')chooseWeapon('fists');else startScan();return}
 if(scene==='scan'){goWeapon();return}
 if(scene==='pick'){const it=menu[menuSel];if(it.id==='other'){gridAll=true;menu=ALLW.map(id=>({id}));menuSel=0}else chooseWeapon(it.id)}}
function nav(dx,dy){if(scene!=='weapon'&&scene!=='pick')return;const n=menu.length;menuSel=(menuSel+dx+(gridAll?dy*3:dy)+n*3)%n}
const WAVES=[['t','t','t','t'],['t','r','t','r','t','r'],['b','t','r','t','b','r','t'],['t','r','t','r','f']];
const TY={t:{hp:2,spd:.17,dmg:8,col:'#a23030',col2:'#6a1a1a',h:1,w:.42,pts:100},r:{hp:1,spd:.3,dmg:5,col:'#2f7fb5',col2:'#1a4a70',h:.85,w:.36,pts:100},b:{hp:4,spd:.11,dmg:15,col:'#5a3a8a',col2:'#33205a',h:1.12,w:.62,pts:250},f:{hp:14,spd:.08,dmg:22,col:'#c8a020',col2:'#7a5a10',h:1.28,w:.72,pts:1500}};
const stars=Array.from({length:40},(_,i)=>({x:(i*97)%W,y:(i*53)%(HZ-6),b:i%3}));
const BLD=Array.from({length:22},(_,i)=>({x:i*12-6,w:12+(i*7)%9,h:18+((i*37)%26)}));
const ex=e=>VPX+e.lane*(105*Math.pow(e.z,1.1))+e.off*e.z, ey=e=>HZ+(H-HZ+10)*Math.pow(e.z,1.5), eh=e=>110*Math.pow(e.z,1.15)*e.T.h;
function startWave(){queue=WAVES[wave].slice();spawnT=.9;banner='WAVE '+(wave+1)+(wave===WAVES.length-1?'  -  BOSS':'');bannerT=2}
function startGame(){scene='play';hp=100;score=0;wave=0;kills=0;combo=0;bestCombo=0;E=[];pops=[];sw=null;swCd=0;won=false;startWave()}
function spawn(k){const T=TY[k];E.push({k,T,lane:[-1,0,1][(Math.random()*3)|0],off:(Math.random()-.5)*16,z:.12,hp:T.hp,max:T.hp,state:'walk',t:0,fl:0,ph:Math.random()*6})}
function press(src){
 if(scene==='title'){goWeapon();return}
 if(scene==='weapon'||scene==='scan'||scene==='pick'){if(src!=='arm')menuOK();return}
 if(scene==='cal'){if(src!=='arm'){cal.done=true;startGame()}return}
 if(scene==='end'){if(endT>1.5)startOrCal();return}
 if(src!=='arm'&&camLive())return; // camera on: only a real bat swing counts
 if(sw||swCd>0)return;
 swing=.28;swCd=WP[weapon].cd;punch^=1;sw={pend:.12,pk:Math.max(spd,src==='arm'?0:FORCE*(1.2+Math.random()*.9)),src}}

function hit(e,dmg){e.hp-=dmg;e.fl=.16;e.z=Math.max(.3,e.z-.11*dmg);combo++;comboT=1.8;if(combo>bestCombo)bestCombo=combo;score+=10*combo;shake=.12;

 else{e.state='stun';e.t=0;pop(ex(e),ey(e)-eh(e)*.8,dmg>2?'SMASH':'HIT','#fff')}}
// A swing sweeps the bat's whole path: every enemy close enough to that path takes the hit. Swing speed sets the damage.
function resolveSwing(){
 const pw=clamp(sw.pk/(FORCE*2.2),.1,1),dmg=clamp((pw>.8?3:pw>.45?2:1)+WP[weapon].d,1,4),h=handPx();let x0=h.x,x1=h.x;
 if(sw.src==='arm'){const nw=performance.now();for(const q of samples){if(nw-q.t>350)continue;const px=W*clamp(.5+(q.x-.5)*GX,.02,.98);x0=Math.min(x0,px);x1=Math.max(x1,px)}}

 if(pw>.92&&n)flash=.15;
 if(!n){pop(h.x,h.y-8,'WHIFF','#9aa')}
 sw=null}
function hurt(e){hp-=e.T.dmg;hurtF=.3;shake=.35;combo=0;pop(VPX,H*.55,'-'+e.T.dmg,'#ff6a6a');if(hp<=0){hp=0;won=false;scene='end';endT=0}}
function update(dt){clock+=dt;const nw=performance.now();spd=Math.max(armSpeed(nw),spd*Math.pow(.02,dt));if(cool>0)cool-=dt;
 if(camLive()&&spd>=FORCE&&cool<=0&&(scene==='title'||scene==='end'||scene==='play')){cool=.35;press('arm')}
if(scene==='cal'){cal.t+=dt;
  if(cal.done){if(cal.t>=0)startGame()}
  else if(cal.hold>0){cal.hold-=dt;cal.cp=0}
  else if(cal.t>1.2&&camLive()){const sp=Math.min(spd,10);if(sp>cal.cp)cal.cp=sp;
   if(cal.cp>=.7&&sp<.35*cal.cp){const best=cal.peaks.length?Math.max(...cal.peaks):0;cal.hold=.9;
    if(cal.cp>=.35*best){cal.peaks.push(cal.cp);cal.last=cal.cp;cal.n++;if(cal.n>=3)calFinish()}
    cal.cp=0}}}
 
 sm.x+=(hand.x-sm.x)*.5;sm.y+=(hand.y-sm.y)*.5;
 if(swing>0)swing-=dt;if(swCd>0)swCd-=dt;if(flash>0)flash-=dt;if(hurtF>0)hurtF-=dt;if(shake>0)shake-=dt;if(scene==='end')endT+=dt;
 for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<.8);
 if(scene==='scan'){scanT+=dt;if(scanT>=scanSent){ws&&ws.readyState===1&&ws.send(JSON.stringify({type:'scan'}));scanSent+=4}
  if(scanT>13){scanMsg=phoneUp?'NO SCAN RECEIVED. OPEN THE BAT PAGE ON THE PHONE AND START THE CAMERA.':'CONNECT THE PHONE FIRST.';if(scanT>16)goWeapon()}}
 if(scene!=='play')return;
 if(sw){sw.pk=Math.max(sw.pk,spd);sw.pend-=dt;if(sw.pend<=0)resolveSwing()}
 if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
 if(bannerT>0)bannerT-=dt;
 if(queue.length){spawnT-=dt;if(spawnT<=0&&E.filter(e=>e.state!=='dead').length<4){spawn(queue.shift());spawnT=1.1+Math.random()*.7}}
 for(const e of E){e.t+=dt;e.ph+=dt*(4+e.T.spd*10);if(e.fl>0)e.fl-=dt;
  if(e.state==='walk'){e.z+=e.T.spd*dt*(wave>=2?1.15:1);if(e.z>=.86){e.z=.86;e.state='wind';e.t=0}}
  else if(e.state==='wind'){if(e.t>=(e.k==='f'?.95:.75)){hurt(e);if(scene!=='play')return;e.state='back';e.t=0}}
  else if(e.state==='back'){e.z-=dt*.5;if(e.t>=.5){e.state='walk'}}
  else if(e.state==='stun'){if(e.t>=.45)e.state='walk'}}

 if(!queue.length&&E.length===0){waveGap+=dt;if(waveGap>1){waveGap=0;wave++;if(wave>=WAVES.length){won=true;scene='end';endT=0}else{hp=Math.min(100,hp+20);startWave()}}}else waveGap=0}
// ---- drawing ----
function txt(s,x,y,sz,col,al){const g=cg;g.font='bold '+sz+'px monospace';g.textAlign=al||'center';g.fillStyle='#000';g.fillText(s,x+1,y+1);g.fillStyle=col;g.fillText(s,x,y)}
function poly(pts,col){g.fillStyle=col;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill()}
const MTN=Array.from({length:35},(_,i)=>Math.round(3+5*Math.abs(Math.sin(i*.9))+4*Math.abs(Math.sin(i*.37+1))+(i%5==2?4:0)));

function bg(){
 const sky=['#080618','#0e0a26','#160e34','#201244','#2c1654','#3c1a5c','#52206a','#6a2a70'];
 sky.forEach((cl,i)=>{g.fillStyle=cl;g.fillRect(0,i*HZ/8,W,HZ/8+1)});
 stars.forEach(s=>{g.fillStyle=s.b?'#fff':'#889';g.fillRect(s.x,s.y,1,1)});
 BLD.forEach((b,i)=>{g.fillStyle=i%2?'#120a24':'#1a1030';g.fillRect(b.x,HZ-b.h,b.w,b.h);for(let y=HZ-b.h+3;y<HZ-2;y+=4)for(let x=b.x+2;x<b.x+b.w-2;x+=4)if(((x*7+y*13)%5)<2){g.fillStyle='#e8c060';g.fillRect(x,y,1,2)}});
 g.fillStyle='#2a2438';g.fillRect(0,HZ,W,H-HZ);
 for(let i=0;i<10;i++){const a=HZ+Math.pow(i/10,1.8)*(H-HZ),b=HZ+Math.pow((i+1)/10,1.8)*(H-HZ);g.fillStyle=i%2?'#2f2a40':'#272236';g.fillRect(0,a,W,b-a+1)}
 g.fillStyle='#3c344c';poly([[0,HZ],[VPX-34,HZ],[VPX-150,H],[0,H]],'#3a3248');poly([[W,HZ],[VPX+34,HZ],[VPX+150,H+0],[W,H]],'#3a3248'); // sidewalks
 g.strokeStyle='#d8c060';g.lineWidth=1;g.setLineDash([4,6]);g.beginPath();g.moveTo(VPX,HZ);g.lineTo(VPX,H);g.stroke();g.setLineDash([]);
 // side buildings
 poly([[0,0],[58,HZ-30],[58,HZ+2],[0,H-34]],'#1a1230');poly([[W,0],[W-58,HZ-30],[W-58,HZ+2],[W,H-34]],'#1a1230');
 for(let r=0;r<5;r++){const t=(r+1)/6;g.fillStyle=(r+Math.floor(clock*.4))%3?'#e8c060':'#40304e';g.fillRect(6+t*34,t*(HZ-24)+4,8*(1-t*.5),6*(1-t*.4));g.fillStyle=(r+1+Math.floor(clock*.3))%3?'#e8c060':'#40304e';g.fillRect(W-14-t*34-8*(1-t*.5),t*(HZ-24)+4,8*(1-t*.5),6*(1-t*.4))}
 for(const sd of[-1,1]){const lx=VPX+sd*58,ly=HZ+2;g.fillStyle='#222';g.fillRect(lx-1,ly-22,2,22);g.fillStyle='rgba(255,220,120,.35)';g.beginPath();g.arc(lx,ly-23,7,0,7);g.fill();g.fillStyle='#ffe090';g.fillRect(lx-2,ly-24,4,2)}
 g.fillStyle='rgba(232,96,160,.22)';g.fillRect(0,HZ-3,W,3)}
function drawFig(e){
 const x=ex(e),fy=ey(e),T=e.T;let fh=eh(e),fw=fh*T.w,a=1;
 if(e.state==='dead'){const k=clamp(e.t/.5,0,1);a=1-k;fh*=1-k*.5}
 const white=e.fl>0,wind=e.state==='wind',lean=e.state==='stun'?-fh*.05:0,bob=Math.sin(e.ph)*fh*.025;
 g.globalAlpha=a;
 const C=white?'#fff':T.col,C2=white?'#fff':T.col2,SK=white?'#fff':'#d9a066';
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,fy,fw*.7,fh*.05,0,0,7);g.fill();
 const legH=fh*.42,tH=fh*.34,hd=fw*.62,ty=fy-legH-tH+bob;
 const sw1=Math.sin(e.ph)*fw*.12;
 g.fillStyle=C2;g.fillRect(x-fw*.34+sw1+lean,fy-legH,fw*.3,legH);g.fillRect(x+fw*.04-sw1+lean,fy-legH,fw*.3,legH);
 g.fillStyle='#111';g.fillRect(x-fw*.36+sw1+lean,fy-fh*.03,fw*.34,fh*.03);g.fillRect(x+fw*.02-sw1+lean,fy-fh*.03,fw*.34,fh*.03);
 g.fillStyle=C;g.fillRect(x-fw*.5+lean,ty,fw,tH);
 if(e.k==='f'&&!white){g.fillStyle='#f0e0a0';g.fillRect(x-fw*.12+lean,ty,fw*.24,tH)}

function arm(x0,y0,x1,y1,col){const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;poly([[x0+nx*9,y0+ny*9],[x1+nx*4.5,y1+ny*4.5],[x1-nx*4.5,y1-ny*4.5],[x0-nx*9,y0-ny*9]],col)}

function drawW(c,k,hx,hy,a,L,t){const ux=Math.cos(a),uy=Math.sin(a),nx=-uy,ny=ux,s=L/48,at=(u,o)=>[hx+ux*L*u+nx*o,hy+uy*L*u+ny*o];
 if(k==='bat'){stick(c,hx,hy,a,L,1.6*s,5*s,'#c08a48');const q=at(.55,0);stick(c,q[0],q[1],a,L*.45,4*s,5*s,'#e0a860');stick(c,hx,hy,a,L*.22,1.8*s,1.8*s,'#2a2a2a');const e=at(1,0);c.fillStyle='#b07a3c';c.beginPath();c.arc(e[0],e[1],5*s,0,7);c.fill()}
 else if(k==='plank'){stick(c,hx,hy,a,L,3.6*s,3.6*s,'#c99a5a');stick(c,hx,hy,a,L,1.2*s,1.2*s,'#e0b878');for(let u=.15;u<1;u+=.22){const q=at(u,0);stick(c,q[0],q[1],a,L*.06,3.6*s,3.6*s,'#a87a3e')}const e=at(1,0);pl(c,[[e[0]+nx*3.6*s,e[1]+ny*3.6*s],[e[0]-nx*3.6*s,e[1]-ny*3.6*s],[e[0]-nx*3.6*s+ux*2,e[1]-ny*3.6*s+uy*2],[e[0]+nx*3.6*s+ux*2,e[1]+ny*3.6*s+uy*2]],'#8a5a28')}
 else if(k==='club'){stick(c,hx,hy,a,L,1*s,.9*s,'#c8c8d4');stick(c,hx,hy,a,L*.28,1.5*s,1.5*s,'#202028');const e=at(1,0);pl(c,[[e[0]+nx*3*s,e[1]+ny*3*s],[e[0]+ux*8*s+nx*4*s,e[1]+uy*8*s+ny*4*s],[e[0]+ux*8*s-nx*5*s,e[1]+uy*8*s-ny*5*s],[e[0]-nx*5*s,e[1]-ny*5*s]],'#2a2a32');pl(c,[[e[0]+ux*2*s+nx*3*s,e[1]+uy*2*s+ny*3*s],[e[0]+ux*8*s+nx*4*s,e[1]+uy*8*s+ny*4*s],[e[0]+ux*8*s+nx*2*s,e[1]+uy*8*s+ny*2*s]],'#6a6a78')}
 else if(k==='whip'){stick(c,hx,hy,a,L*.5,2*s,2.4*s,'#3a2410');const b=at(.5,0);c.strokeStyle='#6a4020';c.lineWidth=Math.max(1,2*s);c.beginPath();c.moveTo(b[0],b[1]);
  const bend=-1.5*Math.sin(Math.min(t,1)*Math.PI)+(t<=0?.7:0);for(let i=1;i<=12;i++){const u=i/12,ang=a+bend*u*u,x=b[0]+Math.cos(ang)*L*1.3*u+nx*Math.sin(u*9+clock*8)*3*s*u,y=b[1]+Math.sin(ang)*L*1.3*u+ny*Math.sin(u*9+clock*8)*3*s*u;c.lineTo(x,y)}c.stroke();
  if(t>.55&&t<.85){const q=at(1.8,0);c.fillStyle='#fff';c.fillRect(q[0]-2,q[1]-2,4,4)}}
 else if(k==='nunchucks'){const l1=L*.5;stick(c,hx,hy,a,l1,2.2*s,2.2*s,'#5a3418');stick(c,hx,hy,a,l1*.35,2.4*s,2.4*s,'#222');const j=at(.5,0),a2=a+1.5*(1-Math.min(t*1.6,1))+.5*Math.sin(Math.min(t,1)*Math.PI)*-1.6+(t<=0?.5:0);
  c.strokeStyle='#b0b0b8';c.lineWidth=Math.max(1,1.2*s);c.beginPath();c.moveTo(j[0],j[1]);c.lineTo(j[0]+Math.cos(a+(a2-a)*.5)*5*s,j[1]+Math.sin(a+(a2-a)*.5)*5*s);c.stroke();
  const j2=[j[0]+Math.cos(a+(a2-a)*.5)*5*s,j[1]+Math.sin(a+(a2-a)*.5)*5*s];stick(c,j2[0],j2[1],a2,l1,2.2*s,2.2*s,'#5a3418');stick(c,j2[0],j2[1],a2,l1*.35,2.4*s,2.4*s,'#222')}}
function glove(c,x,y,r,col){c.fillStyle='#2a0a0a';c.beginPath();c.arc(x,y,r+1,0,7);c.fill();c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(x-r*.3,y-r*.35,r*.35,0,7);c.fill();c.fillStyle='#e8e8f0';c.fillRect(x-r*.7,y+r*.7,r*1.4,r*.5);c.fillStyle='#fff';c.fillRect(x-r*.1,y-r*.9,r*.2,r*.4)}
function drawFists(h,sp){const f=swing>0?Math.sin(sp*Math.PI):0,L={x:h.x-20,y:h.y+8},R={x:h.x+20,y:h.y+8};

 if(k==='fists'){drawFists(h,sp);return}
 const a=swing>0?-2.3+sp*2.3:-2.3,L=k==='whip'?42:k==='nunchucks'?46:k==='club'?54:k==='plank'?50:48;
 drawW(g,k,h.x,h.y,a,L,sp);

 if(swing>0){g.strokeStyle='rgba(255,200,120,.6)';g.lineWidth=2;g.beginPath();g.arc(h.x,h.y,L*.9,a-.9,a);g.stroke()}}

  txt(phoneUp?'PHONE CONNECTED':'PHONE NOT CONNECTED',W/2,120,7,phoneUp?'#7dff7d':'#ff9a60');txt('PRESS OK TO GO BACK',W/2,132,6,'#d8d8f0');return}
 if(scene==='pick'){const n=menu.length;
  if(!gridAll){txt('WHAT IS IT?',W/2,22,13,'#ffd860');const cw=56,gap=5,x0=(W-(cw*n+gap*(n-1)))/2,lab=['BEST GUESS','2ND GUESS','3RD GUESS','NONE OF THESE'];
   menu.forEach((it,i)=>{const x=x0+i*(cw+gap),y=36,h=78;card(x,y,cw,h,i===menuSel);icon(it.id,x+cw/2,y+30,38);
    txt(it.id==='other'?'NONE OF':WP[it.id].n.split(' ')[0],x+cw/2,y+62,it.id==='other'?7:8,'#fff');txt(it.id==='other'?'THESE':(WP[it.id].n.split(' ')[1]||''),x+cw/2,y+71,7,'#fff');

   menu.forEach((it,i)=>{const cw=74,x=(W-(cw*3+8))/2+(i%3)*(cw+4),y=28+((i/3)|0)*50,h=46;card(x,y,cw,h,i===menuSel);icon(it.id,x+cw/2,y+17,28);txt(WP[it.id].n,x+cw/2,y+h-9,6,'#fff');txt(WP[it.id].hint,x+cw/2,y+h-2,4,'#cfd8ff')});

function draw(){
 g.save();if(shake>0)g.translate((Math.random()-.5)*5*shake/.35,(Math.random()-.5)*4*shake/.35);

 if(scene==='play'){[...E].sort((p,q)=>p.z-q.z).forEach(drawFig)}

  cg.fillStyle='rgba(0,0,0,.65)';cg.fillRect(5,5,84,9);cg.fillStyle=hp>35?'#5adf5a':'#ef4a4a';cg.fillRect(6,6,82*clamp(hp/100,0,1),7);txt('HP',7,22,8,'#fff','left');

  {const mw=70,fr=clamp(spd/(FORCE*2.2),0,1);cg.fillStyle='rgba(0,0,0,.6)';cg.fillRect(6,H-11,mw,5);cg.fillStyle=spd>=FORCE?'#7dff7d':'#6ab0ff';cg.fillRect(6,H-11,mw*fr,5);cg.fillStyle='#fff';cg.fillRect(6+mw*FORCE/(FORCE*2.2),H-12,1,7)}}
