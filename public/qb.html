<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quarterback</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;image-rendering:pixelated;image-rendering:crisp-edges}</style></head><body>
<canvas id="c" width="256" height="144"></canvas>
<script>
// QUARTERBACK - first-person hail-mary passing demo. Hand motion comes from the phone camera (posesend.html). OK / trigger = throw (full force).
const qp=new URLSearchParams(location.search),DEBUG=qp.has('debug'),room=(qp.get('room')||'ABCD').toUpperCase();
const TS=+qp.get('ts')||1;                 // time scale (testing only)
const FORCE=+qp.get('force')||1.3;         // arm speed needed to count as a throw, in camera-widths per second (TUNE THIS)
const WIN=+qp.get('win')||1.5;             // seconds the receiver stays open
const SACKT=3;                             // seconds after the window closes before the sack
const NDR=+qp.get('drives')||4;            // possessions per game
const GX=+qp.get('gx')||1.8,GY=+qp.get('gy')||1.8;
const W=256,H=144,HZ=56,VPX=128;
const c=document.getElementById('c'),cg=c.getContext('2d');
const bufc=document.createElement('canvas');bufc.width=W;bufc.height=H;
const g=bufc.getContext('2d',{willReadFrequently:true});g.imageSmoothingEnabled=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// ---- fisheye + PS1-style color ----
const FK=.5,MAP=new Int32Array(W*H),VG=new Uint16Array(W*H),BAY=[-4,0,-3,1,2,-2,3,-1,-3,1,-4,0,4,-1,2,-2];
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=(x+.5)/W*2-1,py=(y+.5)/H*2-1,r2=px*px+py*py,f=(1+FK*r2)/(1+FK);
 const sx=Math.floor((px*f+1)/2*W),sy=Math.floor((py*f+1)/2*H),i=y*W+x;
 MAP[i]=(sx<0||sx>=W||sy<0||sy>=H)?-1:sy*W+sx;VG[i]=Math.max(40,Math.round(256*(1-.42*(r2/2)*(r2/2)*2)))}
function present(){const id=g.getImageData(0,0,W,H),src=new Uint32Array(id.data.buffer),od=cg.createImageData(W,H),out=new Uint32Array(od.data.buffer);
 for(let i=0;i<W*H;i++){const s=MAP[i];if(s<0){out[i]=0xFF000000;continue}
  const p=src[s],v=VG[i],d=BAY[(i&3)|(((i>>8)&3)<<2)];
  let r=((p&255)*v>>8)+d,gg=(((p>>8)&255)*v>>8)+d,b=(((p>>16)&255)*v>>8)+d;
  r=r<0?0:r>255?255:r;gg=gg<0?0:gg>255?255:gg;b=b<0?0:b>255?255:b;r&=0xF8;gg&=0xF8;b&=0xF8;r|=r>>5;gg|=gg>>5;b|=b>>5;
  out[i]=0xFF000000|(b<<16)|(gg<<8)|r}
 cg.putImageData(od,0,0)}
const toScene=(dx,dy)=>{const x=clamp(Math.floor(dx),0,W-1),y=clamp(Math.floor(dy),0,H-1),s=MAP[y*W+x];return s<0?{x:dx,y:dy}:{x:s%W,y:(s/W)|0}};
// ---- state ----
let scene='title',clock=0,score=0,drive=0,down=1,toGo=60,pl=null,bag=[],msg='',sub='',msgT=0,shake=0,flash=0,endT=0,cool=0;
let hand={x:.5,y:.6},sm={x:.5,y:.6},samples=[],spd=0,lastHandAt=0,phoneUp=false,dbg=null;
const stars=Array.from({length:40},(_,i)=>({x:(i*97)%W,y:(i*53)%(HZ-8),b:i%3}));
const lights=Array.from({length:90},(_,i)=>({x:(i*37)%W,y:HZ-11+((i*13)%10),c:i%3}));
// ---- network ----
let ws=null;
function conn(){try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+room+'&role=tv');
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
  if(m.type==='peer_joined')phoneUp=true;else if(m.type==='peer_left')phoneUp=false;
  else if(m.type==='pose'){phoneUp=true;if(m.v>.4){const n=performance.now();hand.x=m.x;hand.y=m.y;lastHandAt=n;pushSample(n,m.x,m.y)}}
  else if(m.type==='fire_down')press()};
 ws.onclose=()=>{phoneUp=false;setTimeout(conn,1500)};ws.onerror=()=>{try{ws.close()}catch(e){}}}catch(e){setTimeout(conn,3000)}}
conn();setInterval(()=>{try{if(ws&&ws.readyState===1)ws.send('{"type":"ping"}')}catch(e){}},20000);
function pushSample(t,x,y){samples.push({t,x,y});while(samples.length&&t-samples[0].t>600)samples.shift()}
// arm speed over the last ~100-160 ms, camera-widths per second (needs 2+ samples, so one noisy frame cannot trigger a throw)
function armSpeed(now){if(samples.length<2)return 0;const b=samples[samples.length-1];if(now-b.t>130)return 0;
 let a=null;for(const s of samples){const age=now-s.t;if(age<=170&&b.t-s.t>=70){a=s;break}}if(!a)return 0;
 return Math.hypot(b.x-a.x,b.y-a.y)/((b.t-a.t)/1000)}
// ---- world: yards -> screen. d = yards from the QB downfield, lat = yards left/right ----
const A=10,SC=6.5,sc=d=>A/(A+d),PX=(lat,d)=>VPX+lat*SC*sc(d),PY=(d,h)=>HZ+(H-HZ)*sc(d)-(h||0)*SC*sc(d)*.9;
const PLAYS=[
 {n:'DEEP LEFT CORNER',lat:-17,de:5,wait:2.0},{n:'DEEP RIGHT CORNER',lat:17,de:5,wait:3.2},
 {n:'BACK OF END ZONE LEFT',lat:-8,de:9,wait:4.4},{n:'BACK OF END ZONE RIGHT',lat:9,de:9,wait:2.6},
 {n:'MIDDLE SEAM',lat:0,de:6,wait:3.8},{n:'LEFT SIDELINE',lat:-23,de:3,wait:5.0},
 {n:'RIGHT SIDELINE',lat:23,de:3,wait:1.6},{n:'DEEP POST',lat:3,de:8,wait:4.0}];
function nextRoute(){if(!bag.length){bag=PLAYS.slice();for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
  if(pl&&pl.route&&bag[bag.length-1]===pl.route){bag.unshift(bag.pop())}} // never the same receiver twice in a row
 return bag.pop()}
const goal=()=>toGo+7; // yards from the QB to the goal line
function startGame(){scene='play';score=0;drive=0;startDrive()}
const TG=+qp.get('tg')||0; // testing: fixed starting distance
function startDrive(){toGo=TG||30+5*Math.floor(Math.random()*10);down=1;startPlay()}
function startPlay(){const kind=down<4?'pass':(toGo<=45?'fg':'punt');
 pl={kind,phase:'hike',t:0,tr:0,route:kind==='pass'?nextRoute():null,wait:kind==='pass'?0:1+Math.random()*1.4,out:null,driveEnd:false};
 if(pl.route)pl.wait=pl.route.wait;msg='';msgT=0}
function target(){const G=goal();
 if(pl.kind==='pass'){const r=pl.route,d=G+r.de;return{x:PX(r.lat,d),y:PY(d,2)}}
 if(pl.kind==='fg')return{x:PX(0,G+10),y:PY(G+10,6)};
 return{x:VPX,y:HZ-26}}
function recv(){const r=pl.route,G=goal(),u=Math.min(1,pl.tr/pl.wait),e=u*u*(3-2*u)*.4+u*.6,lat0=r.lat*.35,d0=G-24;
 return{lat:lat0+(r.lat-lat0)*e,d:d0+((G+r.de)-d0)*e}}
function gap(){if(pl.phase==='wait'||pl.phase==='hike'){const k=pl.wait-.5;return 1+(pl.tr>k?(pl.tr-k)/.5*2:0)}
 if(pl.phase==='open')return 3+4*Math.min(1,pl.t/.25);
 if(pl.phase==='closed')return 7-6.7*Math.min(1,pl.t/1.2);
 return pl.out&&pl.out.type==='td'?7:.4}
// ---- input -> throw ----
function press(){
 if(scene==='title'){startGame();return}
 if(scene==='end'){if(endT>1.2)startGame();return}
 throwNow()}
function throwNow(){if(scene!=='play'||!pl||cool>0)return;const ph=pl.phase;if(ph==='hike'||ph==='ball'||ph==='result')return;
 const h=handPx(),t=target();pl.from={x:h.x,y:h.y};cool=.8;
 const side=Math.random()<.5?-1:1;
 if(pl.kind==='pass'){
  if(ph==='open'){pl.out={type:'td'};pl.end=t}
  else{pl.out={type:'inc',why:ph==='wait'?'THROWN TOO EARLY - NOBODY OPEN':'THROWN AWAY'};pl.end={x:t.x+side*(22+Math.random()*18),y:t.y+8}}}
 else if(pl.kind==='fg'){
  if(ph==='open'){pl.out={type:'fgg'};pl.end=t}
  else{pl.out={type:'fgb',why:ph==='wait'?'KICKED TOO EARLY':'TOO LATE'};pl.end={x:t.x+side*42,y:t.y}}}
 else{
  if(ph==='open'){pl.out={type:'punt',yds:38+Math.floor(Math.random()*21)};pl.end=t}
  else{pl.out={type:'punt',yds:12+Math.floor(Math.random()*14),why:'SHANKED'};pl.end={x:t.x+side*40,y:t.y+22}}}
 pl.phase='ball';pl.t=0;pl.dur=pl.kind==='pass'?1.5:1.6}
function resolve(){const o=pl.out;msgT=1.8;sub=o.why||'';
 if(o.type==='td'){score+=7;msg='TOUCHDOWN!  +7';pl.driveEnd=true;flash=1}
 else if(o.type==='inc'){down++;msg='INCOMPLETE'}
 else if(o.type==='sack'){toGo=Math.min(95,toGo+8);down++;msg='SACKED!  -8 YDS';sub='';shake=8;flash=.5}
 else if(o.type==='fgg'){score+=3;msg='FIELD GOAL!  +3';pl.driveEnd=true;flash=.6}
 else if(o.type==='fgb'){msg='NO GOOD';pl.driveEnd=true}
 else if(o.type==='punt'){msg='PUNT  '+o.yds+' YDS';pl.driveEnd=true}
 pl.phase='result';pl.t=0}
function update(dt){dt*=TS;clock+=dt;const now=performance.now();
 sm.x+=(hand.x-sm.x)*.5;sm.y+=(hand.y-sm.y)*.5;
 spd=Math.max(armSpeed(now),spd*Math.pow(.02,dt));if(cool>0)cool-=dt;if(msgT>0)msgT-=dt;if(flash>0)flash-=dt*1.6;if(shake>0)shake-=dt*14;
 if(scene==='end')endT+=dt;
 if(scene!=='play'||!pl)return;
 if(spd>=FORCE)throwNow();
 pl.t+=dt;
 if(pl.phase==='hike'){if(pl.t>=.9){pl.phase='wait';pl.t=0}}
 else if(pl.phase==='wait'){pl.tr+=dt;if(pl.t>=pl.wait){pl.phase='open';pl.t=0}}
 else if(pl.phase==='open'){pl.tr+=dt;if(pl.t>=WIN){pl.phase='closed';pl.t=0}}
 else if(pl.phase==='closed'){pl.tr+=dt;
  if(pl.kind==='pass'){if(pl.t>=SACKT){pl.out={type:'sack'};resolve()}}
  else if(pl.t>=1){pl.out={type:'fgb',why:'DELAY OF GAME - NO KICK'};resolve()}}
 else if(pl.phase==='ball'){if(pl.t>=pl.dur)resolve()}
 else if(pl.phase==='result'){if(pl.t>=1.9){
   if(pl.driveEnd){drive++;if(drive>=NDR){scene='end';endT=0}else startDrive()}else startPlay()}}}
// ---- drawing ----
const handPx=()=>dbg&&performance.now()-lastHandAt>1500?dbg:{x:W*clamp(.5+(sm.x-.5)*GX,.02,.98),y:H*clamp(.5+(sm.y-.6)*GY,.08,.95)};
function txt(s,x,y,sz,col,al){const q=cg;q.font='bold '+sz+'px monospace';q.textAlign=al||'center';q.fillStyle='#000';q.fillText(s,x+1,y+1);q.fillStyle=col;q.fillText(s,x,y)}
function poly(pts,col){g.fillStyle=col;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill()}
function sky(){g.fillStyle='#10201a';g.fillRect(0,0,W,H);const cl=['#0c0a2a','#150f3a','#221448','#34185a','#4c1f66','#6a2a6e','#8a3a70','#a84c72'];
 cl.forEach((k,i)=>{g.fillStyle=k;g.fillRect(0,i*HZ/8,W,HZ/8+1)});
 stars.forEach(s=>{g.fillStyle=s.b?'#fff':'#bbb';g.fillRect(s.x,s.y,1,1)});
 g.fillStyle='#e8d8f0';g.beginPath();g.arc(205,18,9,0,7);g.fill();g.fillStyle='#c0a8d0';g.beginPath();g.arc(201,15,3,0,7);g.fill();
 g.fillStyle='#9ad0e0';g.beginPath();g.arc(46,26,5,0,7);g.fill();
 g.fillStyle='#1a1030';g.fillRect(0,HZ-12,W,12);lights.forEach(l=>{g.fillStyle=l.c?'#ffe9a0':'#9ad8ff';g.fillRect(l.x,l.y,1,1)})} // stadium stands + crowd lights
function field(){const G=goal();
 for(let d=0;d<130;d+=5){const y0=PY(d),y1=PY(d+5),k=Math.floor((G-d)/5)&1,inEZ=d>=G&&d<G+10,out=d>=G+10;
  poly([[PX(-27,d),y0],[PX(27,d),y0],[PX(27,d+5),y1],[PX(-27,d+5),y1]],out?'#10201a':inEZ?(k?'#5a2a7a':'#4a2068'):(k?'#1e5a3a':'#18482e'))}
 g.strokeStyle='#d8e8e0';g.lineWidth=1;g.beginPath();
 for(let k=0;G-10*k>1;k++){const d=G-10*k;g.moveTo(PX(-26.5,d),PY(d));g.lineTo(PX(26.5,d),PY(d))}
 g.moveTo(PX(-26.5,G+10),PY(G+10));g.lineTo(PX(26.5,G+10),PY(G+10));
 g.moveTo(PX(-26.5,0),PY(0));g.lineTo(PX(-26.5,130),PY(130));g.moveTo(PX(26.5,0),PY(0));g.lineTo(PX(26.5,130),PY(130));g.stroke();
 g.strokeStyle='#ffffff';g.lineWidth=2;g.beginPath();g.moveTo(PX(-26.5,G),PY(G));g.lineTo(PX(26.5,G),PY(G));g.stroke();
 // goal posts
 const dp=G+10;g.strokeStyle='#ffd040';g.lineWidth=1.5;g.beginPath();
 g.moveTo(PX(0,dp),PY(dp,0));g.lineTo(PX(0,dp),PY(dp,3));g.moveTo(PX(-3,dp),PY(dp,3));g.lineTo(PX(3,dp),PY(dp,3));
 g.moveTo(PX(-3,dp),PY(dp,3));g.lineTo(PX(-3,dp),PY(dp,10));g.moveTo(PX(3,dp),PY(dp,3));g.lineTo(PX(3,dp),PY(dp,10));g.stroke()}
function person(x,y,hgt,jer,run,ph,arms){const w=hgt*.5;
 g.fillStyle='#202030';const l=Math.sin(ph*14)*hgt*.12*run;g.fillRect(x-w/2+l,y-hgt*.32,w*.42,hgt*.32);g.fillRect(x+w*.08-l,y-hgt*.32,w*.42,hgt*.32);
 g.fillStyle=jer;g.fillRect(x-w/2,y-hgt*.72,w,hgt*.42);
 g.fillStyle=jer;g.fillRect(x-w*.34,y-hgt,w*.68,hgt*.17);g.fillStyle='#e0b080';g.fillRect(x-w*.34,y-hgt*.84,w*.68,hgt*.12);
 if(arms){g.fillStyle=jer;g.fillRect(x-w*.8,y-hgt*1.05,w*.28,hgt*.5);g.fillRect(x+w*.52,y-hgt*1.05,w*.28,hgt*.5)}}
const pH=d=>Math.max(8,2.6*SC*sc(d));
function football(x,y,ang,sz){g.save();g.translate(x,y);g.rotate(ang);g.fillStyle='#7a3f1c';g.beginPath();g.ellipse(0,0,sz,sz*.55,0,0,7);g.fill();
 g.strokeStyle='#e8e0d0';g.lineWidth=1;g.beginPath();g.moveTo(-sz*.35,0);g.lineTo(sz*.35,0);g.stroke();g.restore()}
function cross(){if(!pl||pl.phase==='ball'||pl.phase==='result')return;const t=target(),ph=pl.phase,open=ph==='open',blink=Math.floor(clock*10)%2;
 const r=open?13:11;let col,a;
 if(open){col='255,32,32';a=blink?1:.35}else if(ph==='closed'){col='255,230,60';a=.18}else{col='255,230,60';a=.4}
 g.strokeStyle='rgba('+col+','+a+')';g.fillStyle='rgba('+col+','+(open?a:a*.3)+')';g.lineWidth=open?2:1.5;
 g.beginPath();g.arc(t.x,t.y,r,0,7);g.stroke();g.beginPath();g.arc(t.x,t.y,3,0,7);g.fill();
 g.beginPath();g.moveTo(t.x-r-4,t.y);g.lineTo(t.x-4,t.y);g.moveTo(t.x+4,t.y);g.lineTo(t.x+r+4,t.y);g.moveTo(t.x,t.y-r-4);g.lineTo(t.x,t.y-4);g.moveTo(t.x,t.y+4);g.lineTo(t.x,t.y+r+4);g.stroke()}
function players(){if(!pl||pl.kind!=='pass')return;const rv=recv(),gp=gap(),list=[];
 const run=(pl.phase==='wait'||pl.phase==='open'||pl.phase==='closed'||pl.phase==='hike')&&pl.tr<pl.wait?1:0;
 list.push({d:rv.d,f:()=>{const x=PX(rv.lat,rv.d),y=PY(rv.d);person(x,y,pH(rv.d),'#3a6aff',run,clock,pl.phase==='open'||(pl.out&&pl.out.type==='td'&&pl.phase!=='closed'))}});
 const dd=Math.max(.5,rv.d-gp);list.push({d:dd,f:()=>{person(PX(rv.lat+1.4,dd),PY(dd),pH(dd),'#d83030',run,clock+1)}});
 if(pl.phase==='closed'){const u=pl.t/SACKT;[[-7,0],[8,.6]].forEach(([lat,off])=>{const d=Math.max(1,26-24*u+off*2);list.push({d,f:()=>{person(PX(lat*(1-u*.7),d),PY(d),pH(d)*1.9,'#d83030',1,clock*1.3)}})})}
 list.sort((a,b)=>b.d-a.d).forEach(o=>o.f())}
function qbHand(){const h=handPx();
 g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1;
 function arm(x0,y0,x1,y1,col){const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;poly([[x0+nx*9,y0+ny*9],[x1+nx*4.5,y1+ny*4.5],[x1-nx*4.5,y1-ny*4.5],[x0-nx*9,y0-ny*9]],col)}
 arm(W*.18,H+12,W*.36,H-14,'#2e3a66');g.fillStyle='#d9a066';g.fillRect(W*.36-5,H-18,10,8);
 arm(W*.86,H+12,h.x,h.y+3,'#3b4a7a');
 const held=!pl||['hike','wait','open','closed'].includes(pl.phase)||(pl.phase==='result'&&pl.out&&pl.out.type==='sack');
 if(held)football(h.x,h.y-7,-.5,8);
 g.fillStyle='#d9a066';g.fillRect(h.x-5,h.y-4,10,8);g.fillStyle='#a8743c';g.fillRect(h.x-5,h.y+1,10,3)}
function flight(){if(!pl||pl.phase!=='ball')return;const p=Math.min(1,pl.t/pl.dur),a=pl.from,b=pl.end;
 const x=a.x+(b.x-a.x)*p,y=a.y+(b.y-a.y)*p-(pl.kind==='pass'?62:56)*Math.sin(Math.PI*p);
 g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1;g.beginPath();for(let k=0;k<=6;k++){const q=Math.max(0,p-k*.03),qx=a.x+(b.x-a.x)*q,qy=a.y+(b.y-a.y)*q-(pl.kind==='pass'?62:56)*Math.sin(Math.PI*q);k?g.lineTo(qx,qy):g.moveTo(qx,qy)}g.stroke();
 football(x,y,p*9,Math.max(2.5,8-5*p))}
function draw(){
 const sx=shake>0?Math.round((Math.random()-.5)*shake):0,sy=shake>0?Math.round((Math.random()-.5)*shake):0;
 g.save();g.translate(sx,sy);sky();field();
 if(scene==='play'&&pl){players();cross();flight()}
 g.restore();
 qbHand();
 if(flash>0){g.fillStyle='rgba(255,255,255,'+Math.min(.5,flash*.5)+')';g.fillRect(0,0,W,H)}
 if(scene!=='play'){g.fillStyle='rgba(0,0,0,.58)';g.fillRect(0,0,W,H)}
 present();
 if(scene==='play'&&pl){
  txt('DRIVE '+Math.min(drive+1,NDR)+'/'+NDR+'   DOWN '+down+'   '+toGo+' YD TO GO',6,11,7,'#fff','left');txt('SCORE '+score,W-6,11,9,'#fff','right');
  const ph=pl.phase,k=pl.kind;
  if(k!=='pass'&&ph!=='result')txt('4TH DOWN: '+(k==='fg'?'FIELD GOAL':'PUNT'),W/2,22,8,'#ffd860');
  if(ph==='hike'){txt('HIKE!',W/2,40,14,'#ffd860');if(pl.route)txt('RECEIVER: '+pl.route.n,W/2,52,7,'#fff')}
  else if(ph==='wait')txt(k==='pass'?'WAIT FOR THE RED CROSSHAIR':'WAIT FOR THE SNAP',W/2,H-16,7,'#ffd860');
  else if(ph==='open'){if(Math.floor(clock*6)%2)txt(k==='pass'?'THROW NOW!':'KICK NOW!',W/2,44,16,'#ff5050');
   if(spd>=FORCE*.5&&spd<FORCE)txt('HARDER!',W/2,H-16,9,'#ffb060')}
  else if(ph==='closed'){if(k==='pass')txt('COVERED - THROW IT AWAY!  SACK IN '+Math.max(0,Math.ceil(SACKT-pl.t)),W/2,H-16,7,'#ff9a60');else txt('KICK NOW OR LOSE IT',W/2,H-16,7,'#ff9a60')}
  if(msgT>0){txt(msg,W/2,H*.4,15,/TOUCH|GOAL!|PUNT/.test(msg)?'#7dff7d':'#ff6a6a');if(sub)txt(sub,W/2,H*.4+14,7,'#fff')}
  // arm-speed meter (tuning aid): fill = how fast your hand is moving, line = speed needed to throw
  const mw=70,fr=clamp(spd/(FORCE*1.6),0,1);cg.fillStyle='rgba(0,0,0,.6)';cg.fillRect(6,H-11,mw,5);cg.fillStyle=spd>=FORCE?'#7dff7d':'#6ab0ff';cg.fillRect(6,H-11,mw*fr,5);
  cg.fillStyle='#fff';cg.fillRect(6+mw/1.6,H-12,1,7);txt('ARM',6,H-13,6,'#cfd8ff','left');
  if(!DEBUG&&performance.now()-lastHandAt>1500&&Math.floor(clock*2)%2)txt('STEP INTO VIEW OF THE PHONE',W/2,H-3,7,'#ffb060')}
 else if(scene==='title'){
  txt('QUARTERBACK',W/2,40,22,'#ffd860');
  txt('HAIL MARY OFFENSE. YOUR ARM IS THE ARM. THE PHONE WATCHES YOU.',W/2,60,6.5,'#fff');
  txt('WHEN THE CROSSHAIR TURNS RED, THROW HARD. LATE = INCOMPLETE. LATER = SACK.',W/2,71,6.5,'#fff');
  txt('4TH DOWN: A FIELD GOAL OR A PUNT. SAME ARM SWING.',W/2,82,6.5,'#fff');
  txt('PRESS OK TO START',W/2,106,10,Math.floor(clock*2)%2?'#7dff7d':'#3a9a3a');
  txt(DEBUG?'DEBUG: MOUSE = HAND (FLICK IT FAST TO THROW), CLICK = THROW':(phoneUp?'PHONE CONNECTED':'WAITING FOR PHONE (ROOM '+room+')'),W/2,126,7,phoneUp||DEBUG?'#7dff7d':'#ff9a60')}
 else{txt('FINAL SCORE '+score,W/2,56,16,'#ffd860');txt(NDR+' DRIVES',W/2,76,9,'#fff');if(endT>1.2)txt('PRESS OK TO PLAY AGAIN',W/2,108,9,Math.floor(clock*2)%2?'#7dff7d':'#3a9a3a')}}
// ---- input ----
const FIRE_KC=[13,23,32,96,103,105];
addEventListener('keydown',e=>{if(e.repeat)return;if(FIRE_KC.includes(e.keyCode)||e.key==='Enter'||e.key===' ')press()});
if(DEBUG){const m=e=>{const r=c.getBoundingClientRect();dbg=toScene((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);pushSample(performance.now(),e.clientX/innerWidth,e.clientY/innerHeight)};
 addEventListener('mousemove',m);addEventListener('mousedown',e=>{m(e);press()})}
let padPrev={};function pollPad(){try{const gp=(navigator.getGamepads?navigator.getGamepads():[])||[];for(const p of gp){if(!p)continue;for(const i of [0,5,7]){const d=p.buttons[i]&&p.buttons[i].pressed;if(d&&!padPrev[i])press();padPrev[i]=d}}}catch(e){}}
let last=performance.now();
function frame(n){const dt=Math.min((n-last)/1000,.05);last=n;pollPad();update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__qb=()=>({scene,drive,down,toGo,score,spd,msg,pl:pl&&{kind:pl.kind,phase:pl.phase,t:pl.t,wait:pl.wait,route:pl.route&&pl.route.n,out:pl.out&&pl.out.type}});
